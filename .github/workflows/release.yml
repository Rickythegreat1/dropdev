name: Package DevDrop draft

on:
  workflow_call:
    inputs:
      create_draft_release:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: Create an unpublished draft release from the verified artifacts
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build local CLI, observer daemon, and read-only MCP server
        run: cargo build --workspace --release --locked
      - name: Build desktop installer
        run: pnpm --filter @devdrop/desktop tauri build
      - name: Stage command line binaries
        shell: bash
        run: |
          mkdir -p release-artifacts
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          for binary in devdrop devdrop-daemon devdrop-mcp; do
            cp "target/release/${binary}${suffix}" "release-artifacts/${binary}-${RUNNER_OS}-${RUNNER_ARCH}${suffix}"
          done
      - name: Stage installer files
        shell: bash
        run: |
          find apps/desktop/src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp '{}' release-artifacts/ \;
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          folder = Path('release-artifacts')
          files = sorted(p for p in folder.iterdir() if p.is_file())
          assert len(files) >= 4, 'Expected three CLI binaries and at least one desktop installer'
          name = f"SHA256SUMS-{os.environ['RUNNER_OS']}-{os.environ['RUNNER_ARCH']}.txt"
          (folder / name).write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devdrop-${{ runner.os }}-${{ runner.arch }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  draft:
    name: Create unpublished release draft
    if: inputs.create_draft_release
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: devdrop-*
          path: release-artifacts
      - name: Create a draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "DevDrop ${version}" --notes-file docs/release-notes.md
          find release-artifacts -type f -exec gh release upload "$tag" '{}' \;
